# descriptive: find it and understand it
id: crossed-weapons-trophy
title: Trophy of crossed weapons
description: A hanging trophy of arms engraved in brown line on a transparent background, the paper tone kept inside the outlines. A long bow curves across the bundle from upper left to lower right, several slender shafts and a hilted sword cross behind it, and a short tubular case points down at the bottom; the pieces are bound together at the centre. It was cut from the lower left of the letter B sheet, where it hung from the letter's strapwork by a cord with a tassel.
