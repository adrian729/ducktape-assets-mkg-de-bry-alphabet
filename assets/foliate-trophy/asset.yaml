# descriptive: find it and understand it
id: foliate-trophy
title: Foliate trophy tied with a ribbon
description: A hanging trophy engraved in brown line on a transparent background. A broad fluttering ribbon knotted at the centre with its two ends turned outward binds a tall feathered frond rising to the upper right, leafy sprigs spreading to the right and lower left, and two slender rods crossing behind and pointing down to the lower left. It was cut from the lower right of the letter B sheet, where it hung from the strapwork by a cord with a tassel.
