id: seated-man-pulling-looped-cord
title: Seated man pulling a cord
description: A nude man with a cloth draped over his shoulder and lap sits with his knees bent and his head thrown back, facing right, both arms raised to grip a thin cord that runs down past him; a small flower-shaped pendant hangs on the cord beside his hands, and a second cord with a small fruit cluster hangs below at the right. Engraved in brown line with the paper tone kept inside the figure, on a transparent background. On the letter B sheet he sits inside the lower bowl of the letter, which is excluded.
