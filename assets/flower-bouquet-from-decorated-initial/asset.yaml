id: flower-bouquet-from-decorated-initial
title: Bouquet of flowers and buds
description: An upright bunch of flowers engraved in brown line on a transparent background. A round many-petalled bloom sits at the top, a large open flower at the left, several closed buds and long pointed leaves spreading to both sides, and a cluster of stems gathered at the bottom. The vase that held it on the letter B sheet is excluded, so the stems end in a cut at the lower edge.
