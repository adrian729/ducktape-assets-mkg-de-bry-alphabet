title: Oval sunburst with open centre
description: An oval ring of short radiating rays, faint gray on a transparent background, with the centre left empty. On the letter B sheet the glory surrounds the Hebrew Tetragrammaton at the upper right; the lettering is excluded here so the centre is open.
