# descriptive: find it and understand it
id: putto-holding-strap-end
title: Winged putto holding a strap end
description: A curly-haired winged putto sits facing the viewer with a cloth across his lap, his right arm stretched out to the left and his left hand raised to grip the curling end of a strapwork band at the upper right, which ends in a small animal head and has a flower-shaped pendant hanging from it; a small bud and leaf hang below his right hand. Engraved in brown line with the paper tone kept inside the figure, on a transparent background. On the letter B sheet he sits on the top of the letter's strapwork frame, which is excluded.
