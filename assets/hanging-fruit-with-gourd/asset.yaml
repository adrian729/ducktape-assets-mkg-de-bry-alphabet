id: hanging-fruit-with-gourd
title: Hanging fruit with gourd pendant
description: A hanging cluster of fruit engraved in brown line on a transparent background. A large round fruit at the upper left sits among a bunch of small round berries and short leaves, and a long smooth teardrop-shaped gourd hangs from it down the lower right, narrowing to a stalk at the top. On the letter B sheet this cluster hung from a hook at the upper left of the letter's strapwork.
