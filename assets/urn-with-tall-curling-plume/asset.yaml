id: urn-with-tall-curling-plume
title: Smoking urn on a pedestal
description: A plain cylindrical urn on a round pedestal, seen from the front, with a tall column of billowing smoke rising from the flames at its mouth and curling into rounded clouds that lean to the upper left. Engraved in brown line on a transparent background; the foot of the pedestal is cut flat where it met the letter's strapwork on the letter B sheet.
